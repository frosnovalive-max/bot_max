name: max-it-service-bot

services:
  redis:
    image: redis:7-alpine
    container_name: max_bot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_it_bot
    # ⚠️ НЕ указываем image: у второго сервиса-клона — иначе race condition
    # "failed to solve: image already exists" при параллельной сборке (урок №5).
    ports:
      - "8080:8080"
    env_file:
      - .env          # явный env_file — чтобы Docker точно подхватил переменные (урок №4)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_bot_notifier
    # ⚠️ НЕ указываем image: — Docker сам переиспользует собранный образ
    command: ["python", "-m", "max_bot.notification_worker"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      bot:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
